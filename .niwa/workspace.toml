[workspace]
name = "tsukumogami"
content_dir = "claude"

[[sources]]
org = "tsukumogami"

[groups.public]
visibility = "public"

# --- Claude ---

[claude]
marketplaces = ["tsukumogami/shirabe"]
plugins = ["shirabe@shirabe"]

[[claude.hooks.pre_tool_use]]
matcher = "Bash"
scripts = ["hooks/pre_tool_use/gate-online.sh"]

[[claude.hooks.stop]]
scripts = ["hooks/stop/workflow-continue.sh"]

[claude.settings]
permissions = "bypass"

[claude.env]
promote = ["GH_TOKEN"]

# --- Environment ---

[env]
files = ["env/workspace.env"]

# Declare what secrets this workspace can use, without specifying where they come
# from. Nothing here is required: every repo clones, builds and tests without any
# of these set. Each description says what the key buys and what happens without
# it, because that description is the only explanation a contributor gets — niwa
# cannot tell them where a value was supposed to come from.
[env.secrets.recommended]
GH_TOKEN           = "GitHub token. Without one, API calls are unauthenticated and capped at 60 requests/hour, which is usually enough to clone this org but will rate-limit a busy session. `gh auth token` prints one if you already use the gh CLI."

[env.secrets.optional]
ANTHROPIC_API_KEY  = "Anthropic API key. Only needed to run Claude Code against the API; a Claude subscription does not use one. Leave unset unless you are billing to an API key."
TAVILY_API_KEY     = "Tavily search API key. Enables the Tavily provider for web search in research workflows; without it search falls back to DuckDuckGo."
BRAVE_API_KEY      = "Brave search API key. Alternative web-search provider; same fallback applies when unset."
TELEGRAM_BOT_TOKEN = "Telegram bot token. Enables workflow notifications to a Telegram channel; without it notifications are skipped."

# --- Files ---

[files]
"extensions/design.md" = ".claude/shirabe-extensions/"
"extensions/explore.md" = ".claude/shirabe-extensions/"
"extensions/plan.md" = ".claude/shirabe-extensions/"
"extensions/prd.md" = ".claude/shirabe-extensions/"
"extensions/work-on.md" = ".claude/shirabe-extensions/"

# --- Content ---

[claude.content.workspace]
source = "workspace.md"

[claude.content.groups.public]
source = "public.md"

[claude.content.repos.tsuku]
source = "repos/tsuku.md"

  [claude.content.repos.tsuku.subdirs]
  recipes = "repos/tsuku-subdirs/recipes.md"
  telemetry = "repos/tsuku-subdirs/telemetry.md"
  website = "repos/tsuku-subdirs/website.md"

[claude.content.repos.koto]
source = "repos/koto.md"
