[workspace]
name = "tsukumogami"
content_dir = "claude"
# A bare worktree name from an instance root (an Agent-tool subagent with
# worktree isolation) lands in tsuku, the monorepo, instead of the first repo
# by group and name. Needs niwa 0.35.0; older versions warn and ignore it.
default_worktree_repo = "tsuku"

[[sources]]
org = "tsukumogami"

[groups.public]
visibility = "public"

# --- Authority ---

# What `niwa dispatch --grant` and `--role` may hand a worker. With no ceiling
# nothing is grantable. A cut-release grant covers cutting a release, as
# merge-pr covers a merge; an unresolved security line and a declared check's
# `confirm:` still stay a person's call.
# A successor coordinator is dispatched with `--role coordinator` instead of
# being named by instance. The gate-online hook decides merges, closes and
# releases for a dispatched session by its grant, through `niwa authority
# check` (niwa 0.38.0); without cut-release a release is denied, as a merge
# is without merge-pr. Every other session, and every session on a niwa
# without that command, gets the hook's verdict from before the grant.
# `level` is left to niwa's default. Needs niwa 0.36.0; older versions warn and ignore it.
[authority]
ceiling = ["merge-pr", "close-issue", "cut-release"]

[authority.roles.coordinator]
authorities = ["merge-pr", "close-issue", "cut-release"]

# --- Claude ---

[claude]
marketplaces = ["tsukumogami/shirabe", "tsukumogami/koto"]
plugins = ["shirabe@shirabe", "koto-skills@koto"]

[[claude.hooks.pre_tool_use]]
matcher = "Bash"
scripts = ["hooks/pre_tool_use/gate-online.sh"]

[[claude.hooks.stop]]
scripts = ["hooks/stop/workflow-continue.sh"]

[claude.settings]
# No AI attribution in commits or pull requests: this turns off the session
# trailer and session link Claude Code otherwise asks every session to add.
attribution = "false"

[claude.env]
promote = ["GH_TOKEN", "GATE_MERGE_EXEMPT_INSTANCE", "REVIEW_SHADOW_SITES", "JEV_API_KEY", "DOCKER_HOST", "SHIRABE_FLOOR_REQUIRE_ROOTLESS"]

# --- Sessions ---

# What `niwa dispatch` moves into and out of a worker's environment. The
# dispatcher's koto anchor reaches the worker, so the worker's own anchor
# records who dispatched it. The launching shell's KOTO_ANCHOR is dropped, so a
# worker never writes as the session that launched it. Needs niwa 0.36.0.
[session.dispatch_env]
passthrough = ["KOTO_DISPATCHER_ANCHOR"]
unset = ["KOTO_ANCHOR"]

# Runs once for each session niwa reaps, in two steps. The first closes the
# reaped session's koto anchor, and is skipped quietly when there's no reap
# key, no koto, or a koto without `koto session anchor close`. The second
# records the removal through the newest installed shirabe's coordinate skill,
# when that script exists and belongs to this user, and never fails the reap.
# The value is a TOML literal string, so the shell text is exactly what niwa
# runs, with nothing escaped; tests/session-config.test.sh checks it byte for
# byte. Needs niwa 0.36.0.
[session.on_reap]
command = '''[ -n "$NIWA_REAP_KEY" ] && command -v koto >/dev/null 2>&1 && koto session anchor close --help >/dev/null 2>&1 && koto session anchor close --key="$NIWA_REAP_KEY" --harness-session="$NIWA_SESSION_ID"; v=$(ls "$HOME/.claude/plugins/cache/shirabe/shirabe" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1); s="$HOME/.claude/plugins/cache/shirabe/shirabe/$v/skills/coordinate/scripts/unit-removed.sh"; [ -n "$v" ] && [ -O "$s" ] && [ -x "$s" ] && "$s" record >/dev/null 2>&1 || true'''
timeout = "20s"

# Asked before niwa removes an instance or a worktree: by the reap that starts
# `niwa dispatch`, its backstop, `niwa watch`'s discard of a staged review, the
# hook-made worktree sweep and a plain `niwa destroy`. koto answers for the path
# niwa names: exit 0 when no koto run anchored under it still needs it, so niwa
# removes it, and 1 while a run there is running and hasn't been continued
# somewhere else, so niwa keeps it and prints `niwa: kept <instance>: ...` with
# koto's line. A 2 (koto couldn't decide) or a run past the timeout also keeps
# it. A host with no koto, or a koto without `koto session needed`, exits 0 and
# removes as before. `niwa destroy --force` overrides a keep. koto finds its
# sessions from HOME alone, so no names are passed. The value is a TOML literal
# string checked byte for byte by tests/session-config.test.sh. Needs niwa
# 0.40.0 and koto 0.27.0.
[session.before_remove]
command = '''command -v koto >/dev/null 2>&1 || exit 0; koto session needed --help >/dev/null 2>&1 || exit 0; exec koto session needed "$NIWA_REMOVE_PATH"'''
timeout = "10s"

# --- Environment ---

[env]
files = ["env/workspace.env"]

# Declare what secrets this workspace can use, without specifying where they come
# from. Nothing here is required: every repo clones, builds and tests without any
# of these set. Each description says what the key buys and what happens without
# it, because that description is the only explanation a contributor gets — niwa
# cannot tell them where a value was supposed to come from.
[env.secrets.recommended]
GH_TOKEN           = "GitHub token. Without one, API calls are unauthenticated and capped at 60 requests/hour, which is usually enough to clone this org but will rate-limit a busy session. `gh auth token` prints one if you already use the gh CLI."

[env.secrets.optional]
ANTHROPIC_API_KEY  = "Anthropic API key. Only needed to run Claude Code against the API; a Claude subscription does not use one. Leave unset unless you are billing to an API key."
TAVILY_API_KEY     = "Tavily search API key. Enables the Tavily provider for web search in research workflows; without it search falls back to DuckDuckGo."
BRAVE_API_KEY      = "Brave search API key. Alternative web-search provider; same fallback applies when unset."
TELEGRAM_BOT_TOKEN = "Telegram bot token. Enables workflow notifications to a Telegram channel; without it notifications are skipped."
JEV_API_KEY        = "API key for the Jev decider that shirabe's review-shadow sites ask for shadow verdicts (REVIEW_SHADOW_SITES in [env.vars] below). Supply it from an overlay or your personal niwa config. Without it the sites record no-key and send nothing; everything else is unaffected."

[env.vars]
# Turns on shirabe's review-shadow sites, which ask the Jev decider for shadow review verdicts; only repos whose CLAUDE.md declares them public honour it.
REVIEW_SHADOW_SITES = "1"

# Promoted keys whose values are per host. Supply them from an overlay or your
# personal niwa config, never from [env.vars] here: base values win over overlay
# values per key, so a default here would silently replace the overlay's.
[env.vars.optional]
GATE_MERGE_EXEMPT_INSTANCE = "Names of the instances whose sessions may merge pull requests despite the gate-online hook: one name, or several separated by commas, one merging coordinator per host. With niwa 0.38.0 or later it applies only to sessions niwa didn't dispatch; a dispatched session merges by its grant. Leave unset and such sessions are denied merges in every instance, which is the default."
DOCKER_HOST = "Docker daemon socket every session talks to, for hosts that run a rootless daemon (unix:///run/user/<uid>/docker.sock). Leave unset and docker uses its own context or default socket, unchanged."
SHIRABE_FLOOR_REQUIRE_ROOTLESS = "Set to 1 on hosts that allow rootless containers only: shirabe's check-bash-floor.sh then refuses a rootful daemon instead of printing a notice. Leave unset and a rootful daemon is allowed."

# --- Files ---

[files]
"extensions/design.md" = ".claude/shirabe-extensions/"
"extensions/explore.md" = ".claude/shirabe-extensions/"
"extensions/plan.md" = ".claude/shirabe-extensions/"
"extensions/prd.md" = ".claude/shirabe-extensions/"
"extensions/work-on.md" = ".claude/shirabe-extensions/"

# --- Content ---

[content.workspace]
source = "workspace.md"

[content.groups.public]
source = "public.md"

[content.repos.tsuku]
source = "repos/tsuku.md"

  [content.repos.tsuku.subdirs]
  recipes = "repos/tsuku-subdirs/recipes.md"
  telemetry = "repos/tsuku-subdirs/telemetry.md"
  website = "repos/tsuku-subdirs/website.md"

[content.repos.koto]
source = "repos/koto.md"
