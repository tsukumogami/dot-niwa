name: Test hooks

# Runs the case table for the pre-tool gate hook: each row feeds the hook the
# JSON a PreToolUse event carries and checks the decision it prints. Runs on
# Linux and macOS because the hook's scanner is awk, and the two ship different
# awk implementations (mawk or gawk on Ubuntu, the BSD awk on macOS).
#
# Except on a draft pull request, which runs only the Linux legs: hosted macOS
# runners are a small pool shared with release runs across the organization,
# and a draft can't merge. Each job computes its OS list from the event: on a
# pull_request event whose PR is a draft the expression yields
# ["ubuntu-latest"]; anything else (a push to main, where
# github.event.pull_request is empty, or a PR that isn't a draft) yields both
# legs, as before. Marking the PR ready fires ready_for_review, which runs
# both legs on the same head.

on:
  # Naming types replaces GitHub's default three, so they are listed along
  # with ready_for_review.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate-online:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Show tool versions
        run: |
          bash --version | head -1
          jq --version
          ls -lL "$(command -v awk)"
          awk --version 2>&1 | head -1
      - name: Run gate-online case table
        run: bash tests/gate-online.test.sh

  # The env-print-guard hook carries a copy of gate-online's awk scanner, so
  # it runs on the same two awks.
  env-print-guard:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Show tool versions
        run: |
          bash --version | head -1
          jq --version
          ls -lL "$(command -v awk)"
          awk --version 2>&1 | head -1
      - name: Run env-print-guard case table
        run: bash tests/env-print-guard.test.sh

  # gate-online's flag walk reads niwa's --no-progress as taking no value.
  # The hook's own table can't see niwa's flag types, so this asks a pinned
  # niwa release. The binary's sha256 is pinned here, not read from the
  # release's checksums.txt, so a replaced asset fails the job. Bump
  # NIWA_VERSION and NIWA_SHA256 together.
  niwa-flags:
    runs-on: ubuntu-latest
    env:
      NIWA_VERSION: v0.40.0
      NIWA_SHA256: 34cb8fd88892acaff4b37ca6d33a3a9ccdee16c8de75b0932e106a1893b98a1d
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned niwa
        run: |
          mkdir -p "$RUNNER_TEMP/niwa-bin"
          curl -fsSL -o "$RUNNER_TEMP/niwa-bin/niwa" \
            "https://github.com/tsukumogami/niwa/releases/download/${NIWA_VERSION}/niwa-linux-amd64"
          echo "${NIWA_SHA256}  $RUNNER_TEMP/niwa-bin/niwa" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/niwa-bin/niwa"
      - name: Run niwa flag pin
        run: bash tests/niwa-flags.test.sh "$RUNNER_TEMP/niwa-bin/niwa"

  # The on-reap and before-remove commands are shell text inside TOML: this
  # parses them and checks each byte for byte, then runs them under each OS's
  # sh against stubs.
  session-config:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Show tool versions
        run: |
          python3 --version
          ls -lL /bin/sh
      - name: Run session config checks
        run: bash tests/session-config.test.sh
